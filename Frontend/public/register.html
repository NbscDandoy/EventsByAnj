<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Self-Registration</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .card { 
            background: #1e1e1e; 
            padding: 30px 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid #2d2d2d;
        }
        h2 { 
            color: #4da6ff; 
            margin-top: 0;
            margin-bottom: 20px; 
            font-size: 24px;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border: 1px solid #3d3d3d; 
            background-color: #2b2b2b;
            color: #ffffff;
            border-radius: 8px; 
            font-size: 16px; 
            outline: none;
        }
        input::placeholder {
            color: #aaaaaa;
        }
        input:focus {
            border-color: #4da6ff;
        }
        button { 
            width: 100%;
            padding: 14px;
            background-color: #16a34a; 
            color: white; 
            border: none; 
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.2s ease-in-out;
        }
        button:hover { 
            background-color: #15803d; 
        }
        button:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        .message { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 12px; 
            display: none; 
            text-align: center;
        }
        .success { 
            background-color: #064e3b; 
            color: #ecfdf5; 
            border: 1px solid #059669;
        }
        .error { 
            background-color: #7f1d1d; 
            color: #fef2f2; 
            border: 1px solid #dc2626;
        }
        
        /* MALAKING TABLE NUMBER CARD */
        .table-card {
            margin-top: 15px;
            padding: 20px 15px;
            background: #0f172a;
            border-radius: 12px;
            border: 2px solid #22c55e;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
        }
        .table-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin: 0 0 6px 0;
            font-weight: 600;
        }
        .table-display {
            font-size: 42px; /* MALAKING TABLE NUMBER */
            font-weight: 900;
            color: #38bdf8;
            margin: 0;
            line-height: 1.1;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Event Registration</h2>
    <form id="regForm" autocomplete="off">
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="text" id="nickname" placeholder="Nickname (Optional)" />
        <button type="submit" id="btnSubmit">Submit & Check-In</button>
    </form>

    <div id="msgBox" class="message" aria-live="polite"></div>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nameInput = document.getElementById('name');
        const nicknameInput = document.getElementById('nickname');
        const btnSubmit = document.getElementById('btnSubmit');
        const msgBox = document.getElementById('msgBox');

        const name = nameInput.value.trim();
        const nickname = nicknameInput.value.trim();

        if (!name) return;

        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Processing...';
        msgBox.style.display = 'none';

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, nickname })
            });

            const data = await res.json();

            if (data.success) {
                msgBox.className = 'message success';
                
                // Ginagamit ang innerHTML para ma-render ang MALAKING Table Number
                msgBox.innerHTML = `
                    <div style="font-size: 16px; font-weight: bold;">
                        ${data.message}
                    </div>
                    <div class="table-card">
                        <p class="table-title">YOUR TABLE / SEAT NUMBER</p>
                        <p class="table-display">${data.table_no || 'Unassigned'}</p>
                    </div>
                `;
                
                msgBox.style.display = 'block';
                document.getElementById('regForm').reset();
            } else {
                msgBox.className = 'message error';
                msgBox.innerText = data.error || 'An error occurred during registration.';
                msgBox.style.display = 'block';
            }
        } catch (err) {
            msgBox.className = 'message error';
            msgBox.innerText = 'Network error. Please try again.';
            msgBox.style.display = 'block';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Submit & Check-In';
        }
    });
</script>

</body>
</html>
